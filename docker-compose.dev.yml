# Development overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Adds the Vite dev server and bind-mounts the source into the Node services, so
# edits are picked up without a rebuild. The express service still serves
# host/dist if it was built, but in dev you use Vite on :5173 instead.

# The dev image is the build stage, which still has tsx and the source.
x-dev-build: &dev-build
  build:
    context: .
    target: build
  environment: &dev-env
    NODE_ENV: development

services:
  server:
    <<: *dev-build
    environment:
      <<: *dev-env
    volumes:
      - ./workspace:/workspace
      # Source is mounted; node_modules stays the image's (built for linux).
      - ./host:/app/host
      - ./mcp_servers:/app/mcp_servers
    # tsx watch restarts on edit.
    command: ["node", "--import", "tsx", "--watch", "host/server/index.ts"]

  worker:
    <<: *dev-build
    environment:
      <<: *dev-env
    volumes:
      - ./workspace:/workspace
      - ./host:/app/host
      - ./mcp_servers:/app/mcp_servers
    command: ["node", "--import", "tsx", "--watch", "host/server/workers/index.ts"]

  app-mcp:
    <<: *dev-build
    volumes:
      - ./workspace:/workspace
      - ./host:/app/host
      - ./mcp_servers:/app/mcp_servers
    command: ["node", "--import", "tsx", "--watch", "mcp_servers/serve.ts"]

  # Vite, proxying /api to the express service. `--host` is required or it binds
  # to loopback inside the container and nothing reaches it.
  web:
    build:
      context: .
      target: build
    restart: unless-stopped
    environment:
      # host/vite.config.ts reads this for the proxy target.
      AGENT_URL: http://server:8080
    command: ["npx", "vite", "host", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./host:/app/host
    depends_on:
      - server
