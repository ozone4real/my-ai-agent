# Local SearXNG for the agent's web search tool.
#
#   npm run search:up      start it
#   npm run search:down    stop it
#   npm run search:logs    tail logs
#
# Port 8888 rather than SearXNG's usual 8080, which the host agent server uses.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: agent-searxng
    # Bound to loopback on purpose — this instance has its rate limiter off and
    # is not hardened for anything but local use.
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Session-signing key. Local-only instance, so a fixed dev value is fine;
      # override in the shell if you ever expose this beyond loopback.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-local-dev-agent-searxng-secret}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
